name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  types-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build TypeScript and validate contracts
        run: npm run check
